---

- name: Install apache2 packages
  become: true
  ansible.builtin.apt:
    name: "apache2"
    state: present

- name: Display the group variable value
  ansible.builtin.debug:
    msg: "The value of group var for web is: {{ my_group_variable }}"

- name: Display the host variable value
  ansible.builtin.debug:
    msg: "The value of group var for web is: {{ my_host_variable }}"

- name: "Configure apache2"
  template: src={{ item.src }} dest={{ item.dest }}
            owner={{ item.owner }} group={{ item.group }} mode={{ item.mode }}
  become: true
  notify: restart-apache2
  with_items:
  - { src: 'apache2/apache2.conf', dest: '/etc/apache2/apache2.conf', owner: 'root', group: 'root', mode: '0600' }